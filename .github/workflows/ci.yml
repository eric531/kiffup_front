name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Lint (oxlint + ESLint)
        run: npx oxlint . && npx eslint .

      - name: Format check
        run: npx prettier --check src/

      - name: Unit tests
        run: npx vitest run

      - name: Type check and production build
        run: npm run build
        env:
          VITE_API_URL: https://api.eventstay.ci
