<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="KiffUp" />
    <title>KiffUp</title>
    <meta name="theme-color" content="#0e0c1d" />
    <!-- Launch screen, shown before the app's code has loaded (main.ts fades it out). -->
    <style>
      html,
      body {
        background: #07060f;
      }
      #splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-items: center;
        background: radial-gradient(circle at 50% 38%, #2a1350 0%, #07060f 62%);
        transition: opacity 0.35s ease;
      }
      #splash.splash-hidden {
        opacity: 0;
        pointer-events: none;
      }
      #splash .splash-inner {
        display: grid;
        justify-items: center;
        gap: 22px;
      }
      #splash svg {
        width: 96px;
        height: 96px;
        filter: drop-shadow(0 14px 34px rgb(124 58 237 / 0.55));
        animation:
          splash-in 0.6s cubic-bezier(0.22, 1, 0.36, 1) both,
          splash-pulse 1.8s ease-in-out 0.6s infinite;
      }
      #splash .splash-name {
        font:
          800 26px/1 system-ui,
          -apple-system,
          'Segoe UI',
          sans-serif;
        letter-spacing: -0.02em;
        color: #fff;
        animation: splash-in 0.6s cubic-bezier(0.22, 1, 0.36, 1) 0.08s both;
      }
      #splash .splash-name span {
        color: #f97316;
      }
      #splash .splash-bar {
        width: 64px;
        height: 3px;
        border-radius: 3px;
        overflow: hidden;
        background: rgb(255 255 255 / 0.12);
      }
      #splash .splash-bar::after {
        content: '';
        display: block;
        width: 40%;
        height: 100%;
        border-radius: 3px;
        background: linear-gradient(90deg, #f97316, #ec4899, #7c3aed);
        animation: splash-load 1.1s ease-in-out infinite;
      }
      @keyframes splash-in {
        from {
          transform: scale(0.9);
        }
        to {
          transform: none;
        }
      }
      @keyframes splash-pulse {
        50% {
          transform: scale(1.05);
        }
      }
      @keyframes splash-load {
        from {
          transform: translateX(-110%);
        }
        to {
          transform: translateX(260%);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #splash * {
          animation: none !important;
        }
      }
    </style>
    <meta
      name="description"
      content="Concerts, nuits, massages : tout ce que tu kiffes, réservé en 2 minutes. Découvre les lieux en vidéo et réserve chez des partenaires vérifiés."
    />
  </head>
  <body>
    <div id="splash" role="status" aria-label="Chargement de KiffUp">
      <div class="splash-inner">
        <svg viewBox="0 0 100 100" aria-hidden="true">
          <defs>
            <linearGradient id="splash-bg" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#a21caf" />
              <stop offset=".45" stop-color="#7c3aed" />
              <stop offset="1" stop-color="#3b0f8c" />
            </linearGradient>
            <linearGradient id="splash-or" x1="0" y1="0" x2="1" y2="0">
              <stop offset="0" stop-color="#fb923c" />
              <stop offset="1" stop-color="#f97316" />
            </linearGradient>
          </defs>
          <rect width="100" height="100" rx="23" fill="url(#splash-bg)" />
          <path
            d="M13 69 C 30 90, 70 88, 89 55"
            fill="none"
            stroke="url(#splash-or)"
            stroke-width="7.5"
            stroke-linecap="round"
          />
          <g
            fill="none"
            stroke="#fff"
            stroke-width="14"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M36 23 V 72" />
            <path d="M67 24 L 39 51" />
            <path d="M48 46 L 69 71" />
          </g>
          <g transform="translate(36 60)">
            <path
              d="M0 -11 C -6.6 -11 -11 -6.4 -11 -0.6 C -11 6.4 0 15 0 15 C 0 15 11 6.4 11 -0.6 C 11 -6.4 6.6 -11 0 -11 Z"
              fill="url(#splash-or)"
              stroke="#4c1d95"
              stroke-width="2.2"
            />
            <circle cy="-0.8" r="3.6" fill="#fff" />
          </g>
        </svg>
        <div class="splash-name">Kiff<span>Up</span></div>
        <div class="splash-bar"></div>
      </div>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
